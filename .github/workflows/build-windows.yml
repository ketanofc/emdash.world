name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck packages
        run: |
          bun run --cwd common typecheck
          bun run --cwd cli typecheck
          bun run --cwd sdk typecheck
          bun run --cwd packages/agent-runtime typecheck
          bun run --cwd packages/llm-providers typecheck

      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Build Tauri (release)
        working-directory: desktop
        run: cargo tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: emdash-windows-installer
          path: desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
